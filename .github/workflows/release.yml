name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore PSL/PSL.csproj

      - name: Build (.NET Framework 4.8)
        run: msbuild PSL/PSL.csproj /p:Configuration=Release /v:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlainSpaceflightLauncher
          path: PSL/bin/Release/net48/PlainSpaceflightLauncher.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            PlainSpaceflightLauncher（PSL）—— Spaceflight Simulator 第三方启动器。

            下载下面的 `PlainSpaceflightLauncher.exe` 直接运行即可：**单文件**，
            基于 .NET Framework 4.8（Windows 10/11 自带，无需另装运行时）。

            「友站」页的内置浏览器需要系统装有 WebView2 运行时（Win10/11 一般自带；
            没有的话装一次即可）。

            协议：GPL-3.0-only。鸣谢：龙腾猫跃（PCL2）、SFS 中文站。
          files: PSL/bin/Release/net48/PlainSpaceflightLauncher.exe
          draft: false
          prerelease: false
